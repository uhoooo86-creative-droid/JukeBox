<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Go to America! · JukeBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700;800&family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1b2d6b;
  --blue: #2152c9;
  --red: #d8232f;
  --cream: #fdf8ee;
  --line: #efe4cf;
  --ink: #1d1f2b;
  --muted: #7d7768;
  --serif: 'Roboto Slab', Georgia, serif;
  --display: 'DM Serif Display', Georgia, serif;
  --kr: 'Noto Sans KR', sans-serif;
  --mono: 'DM Mono', monospace;
}
body {
  font-family: var(--kr); color: var(--ink); min-height: 100vh; overflow-x: hidden;
  background:
    radial-gradient(ellipse 30% 14% at 12% 16%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(ellipse 26% 12% at 88% 14%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(ellipse 60% 30% at 50% 0%, #eaf2fb, transparent 70%),
    linear-gradient(180deg, #fbf6ec, #f8f1e3);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

/* HEADER */
.header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); box-shadow: 0 2px 14px rgba(60,40,10,.08); }
.header-in { max-width: 1560px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 10px 28px; }
.logo { display: flex; flex-direction: column; line-height: 1; flex-shrink: 0; }
.logo .l1 { font-family: var(--display); color: var(--red); font-size: 22px; margin-left: 30px; transform: rotate(-4deg); }
.logo .l2 { font-family: var(--display); color: var(--navy); font-size: 42px; letter-spacing: -.5px; display: flex; align-items: center; gap: 4px; }
.logo .l2 .plane { font-size: 20px; transform: translateY(-14px) rotate(-18deg); }
.logo .l2 .star { font-size: 14px; color: var(--red); transform: translateY(-4px); }
.logo .l3 { font-size: 9px; letter-spacing: 3px; font-weight: 700; color: var(--navy); margin-top: 3px; text-align: center; border-top: 1px solid #e3c170; padding-top: 3px; width: 190px; }
.nav { display: flex; align-items: center; margin-left: auto; }
.nav a { font-weight: 700; font-size: 17px; color: var(--navy); padding: 6px 22px; position: relative; white-space: nowrap; transition: color .15s; }
.nav a + a::before { content: ''; position: absolute; left: 0; top: 50%; width: 1.5px; height: 16px; background: #d4a5a0; transform: translateY(-50%); }
.nav a:hover { color: var(--red); }
.head-btns { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.jb-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(180deg,#fbe3a6,#f3cd72); color: var(--navy); font-weight: 900; font-size: 17px; padding: 10px 22px; border-radius: 14px; position: relative; }
.jb-btn::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: -10px; height: 3px; background: var(--red); border-radius: 2px; }
.head-sep { width: 2px; height: 34px; background: var(--red); opacity: .6; }
.t-btn { display: inline-flex; align-items: center; gap: 10px; background: #dbe9f8; color: var(--navy); font-weight: 900; font-size: 15px; line-height: 1.05; padding: 8px 20px; border-radius: 22px; text-align: left; }
.t-btn:hover { background: #cadef4; }
.t-btn svg { width: 30px; height: 30px; }
.icon-link { width: 42px; height: 42px; border-radius: 12px; background: #f3ebdc; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; transition: transform .15s; }
.icon-link:hover { transform: translateY(-2px); }

.lang { display: inline-flex; background: #f1ebdf; border-radius: 20px; padding: 3px; }
.lang button { padding: 7px 12px; border-radius: 16px; font-size: 13px; font-weight: 700; color: #7d7768; white-space: nowrap; transition: background .15s, color .15s; }
.lang button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.city .ko { font-size: 13px; font-weight: 500; color: #3a3d4c; margin-top: 6px; }

/* HERO */
.wrap { max-width: 1560px; margin: 0 auto; padding: 18px 44px 48px; }
.hero { position: relative; text-align: center; padding: 18px 0 26px; }
.hero h1 { font-family: var(--display); color: var(--navy); font-size: clamp(48px, 6vw, 86px); line-height: .95; display: inline-flex; align-items: flex-start; gap: 12px; }
.hero h1 .notes { font-size: .42em; margin-top: .35em; }
.hero h1 .n1 { color: var(--red); } .hero h1 .n2 { color: #3a6bd8; }
.hero p { font-size: clamp(16px, 1.8vw, 24px); font-weight: 500; color: #23263a; margin-top: 4px; }
.stamp-round {
  position: absolute; left: 0; top: 10px; width: 120px; height: 120px; border-radius: 50%;
  border: 3px solid rgba(176,120,90,.55); color: rgba(176,120,90,.75);
  display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-14deg);
  font-family: var(--serif); font-weight: 700; line-height: 1.1;
  box-shadow: inset 0 0 0 6px transparent, inset 0 0 0 7.5px rgba(176,120,90,.4);
}
.stamp-round .s1 { font-size: 15px; letter-spacing: 2px; }
.stamp-round .s2 { font-size: 20px; }
.stamp-round .s3 { font-size: 18px; }
.waves { position: absolute; left: 128px; top: 40px; width: 110px; height: 60px; background: repeating-linear-gradient(180deg, transparent 0 9px, rgba(176,120,90,.4) 9px 11px); -webkit-mask: radial-gradient(ellipse 12px 8px at 50% 50%, #000 0, #000 100%); border-radius: 50%/10%; opacity: .8; }
.stamp-rect {
  position: absolute; right: 0; top: 18px; width: 140px; height: 96px; transform: rotate(-12deg);
  border: 3px dashed rgba(176,120,90,.55); outline: 2px solid rgba(176,120,90,.35); outline-offset: 5px;
  color: rgba(176,120,90,.8); font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
}
.stamp-rect small { font-size: 11px; letter-spacing: 3px; margin-top: 4px; }
.flight { position: absolute; right: 14%; top: 22px; width: 24%; height: 90px; pointer-events: none; }

/* CITY GRID */
.cities { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; }
.city {
  position: relative; height: 164px; border-radius: 10px; overflow: hidden; text-align: left;
  background: #fff; border: 2px solid #eee5d4;
  box-shadow: 0 6px 16px rgba(60,40,10,.07);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.city:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(60,40,10,.12); }
.city.active { border-color: var(--red); box-shadow: 0 0 0 3px rgba(216,35,47,.12), 0 12px 24px rgba(60,40,10,.12); }
.city .scene { position: absolute; inset: 0; background: var(--sky); }
.city .scene::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: var(--ground); }
.city .scene::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: linear-gradient(90deg, rgba(255,253,248,.97) 0 55%, rgba(255,253,248,0)); }
.city .a1 { position: absolute; right: 14px; bottom: 6px; font-size: 76px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,.12)); transition: transform .25s; }
.city .a2 { position: absolute; right: 96px; bottom: 10px; font-size: 38px; line-height: 1; opacity: .95; }
.city:hover .a1, .city.active .a1 { transform: translateY(-4px) scale(1.05); }
.city .txt { position: relative; z-index: 2; padding: 16px 22px; }
.city .num { font-family: var(--serif); font-weight: 800; font-size: 28px; line-height: 1; }
.city .num.r { color: var(--red); } .city .num.b { color: var(--blue); }
.city .name { font-family: var(--serif); font-weight: 800; font-size: 26px; color: var(--navy); line-height: 1.1; margin-top: 8px; letter-spacing: -.3px; }
.city .bar { display: block; width: 26px; height: 2px; background: #e6a5a2; margin-top: 8px; border-radius: 1px; }
.city .sub { font-size: 13px; font-weight: 500; color: #3a3d4c; margin-top: 6px; }
.city .now-tag { position: absolute; left: 22px; bottom: 12px; z-index: 2; display: none; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--red); letter-spacing: 1px; }
body.is-playing .city.active .now-tag { display: inline-flex; }
.city .now-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: blink 1s infinite alternate; }
@keyframes blink { to { opacity: .2; } }

/* COLLAPSE */
.cities { max-height: 1400px; transition: max-height .45s ease, opacity .3s ease, margin .3s ease; overflow: hidden; padding: 4px; margin: -4px; }
body.open .cities { max-height: 0; opacity: 0; pointer-events: none; margin-bottom: -22px; }
body:not(.has-city) .player { display: none; }
body.has-city .player { animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.list-btn { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding: 9px 14px; border-radius: 20px; background: #eef2fb; color: var(--navy); font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s; }
.list-btn:hover { background: #dfe7f7; }
.list-btn svg { width: 16px; height: 16px; transition: transform .3s; }
body:not(.open) .list-btn svg { transform: rotate(180deg); }
.list-btn + .close { margin-left: 0; }

/* PLAYER */
.player {
  margin-top: 22px; background: var(--cream); border: 2px solid #f1dfb8; border-radius: 12px;
  padding: 12px 22px 16px 12px; display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 22px;
  box-shadow: 0 8px 24px rgba(60,40,10,.08);
}
.thumb { height: 132px; border-radius: 6px; overflow: hidden; position: relative; background: var(--sky, linear-gradient(180deg,#dbe9f8,#fff)); box-shadow: 0 0 0 3px #fff, 0 3px 10px rgba(0,0,0,.15); align-self: start; }
.thumb::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: var(--ground, transparent); }
.thumb span { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 78px; line-height: 1; }
.p-body { min-width: 0; }
.p-top { display: flex; align-items: flex-start; gap: 12px; padding: 4px 0 10px; border-bottom: 1px solid var(--line); }
.p-title { font-family: var(--serif); font-weight: 800; font-size: 30px; color: var(--navy); line-height: 1.05; }
.p-sub { font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }
.close { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: #f1ebdf; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s; }
.close:hover { background: #e7dfcf; }
.close svg { width: 18px; height: 18px; }
.p-top { flex-wrap: wrap; }
.p-top > div:first-child { flex: 1 1 0; min-width: 0; }
.p-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; flex-basis: 100%; }
.p-actions:not(:has(.show)) { display: none; }
.lesson-btn { display: none; align-items: center; gap: 8px; padding: 9px 16px 9px 10px; border-radius: 22px; background: var(--navy); color: #fff; font-weight: 700; font-size: 14px; box-shadow: 0 3px 10px rgba(27,45,107,.3); transition: transform .12s, background .15s; }
.lesson-btn.show { display: inline-flex; }
.lesson-btn:hover { background: #22388a; transform: translateY(-1px); }
.lesson-btn .ic { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--navy); display: flex; align-items: center; justify-content: center; }
.lesson-btn .ic svg { width: 15px; height: 15px; }
.setup-btn { background: #2f7a4a; box-shadow: 0 3px 10px rgba(47,122,74,.3); }
.setup-btn:hover { background: #276840; }
.setup-btn .ic { color: #2f7a4a; }
.s-gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.s-gal figure { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; cursor: zoom-in; transition: transform .12s, box-shadow .12s; }
.s-gal figure:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.1); }
.s-gal img { display: block; width: 100%; height: 130px; object-fit: contain; background: #f6f2ea; }
.s-gal figcaption { padding: 6px 10px; font-size: 13px; font-weight: 600; color: #3a3d4c; line-height: 1.35; }
.s-step { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.s-step .l-sh { margin-bottom: 8px; }
.s-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.s-thumbs img { height: 88px; width: auto; max-width: 160px; object-fit: contain; border-radius: 6px; background: #f6f2ea; border: 1px solid var(--line); cursor: zoom-in; flex-shrink: 0; }
.s-note { background: #fff8e8; border: 1.5px dashed #ecd7a6; color: #8a6a1e; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(10,10,20,.9); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; border-radius: 6px; background: #fff; }
.lightbox p { color: #fff; margin-top: 12px; font-weight: 600; text-align: center; }
.lbody { padding: 4px 22px 22px; max-height: min(70vh, 640px); overflow-y: auto; font-size: 15px; line-height: 1.7; color: #2a2c38; }
.lbody h3 { font-family: var(--serif); color: var(--navy); font-size: 17px; margin: 16px 0 6px; }
.lbody ul, .lbody ol { padding-left: 20px; }
.l-meta { margin-top: 2px; }
.l-topic { font-weight: 700; color: var(--navy); margin-top: 8px; }
.l-expr { display: flex; flex-wrap: wrap; gap: 6px; }
.l-expr span { background: #eef2fb; color: var(--navy); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 600; line-height: 1.45; }
.l-steps { list-style: none; padding: 0 !important; counter-reset: st; display: flex; flex-direction: column; gap: 8px; }
.l-steps li { counter-increment: st; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px 10px 50px; position: relative; }
.l-steps li::before { content: counter(st); position: absolute; left: 14px; top: 11px; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.l-sh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.l-sh b { color: var(--navy); font-size: 15px; }
.l-sh span { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.l-steps p { margin-top: 2px; font-size: 14.5px; }
.l-mat { font-size: 14px; color: #4a4c58; }
.lbody .tag { display: inline-block; background: #f1ebdf; border-radius: 10px; padding: 1px 10px; font-size: 12px; font-weight: 700; color: #7d7768; margin-right: 6px; }
.video-btn { display: none; align-items: center; gap: 8px; padding: 9px 16px 9px 10px; border-radius: 22px; background: #d8232f; color: #fff; font-weight: 700; font-size: 14px; box-shadow: 0 3px 10px rgba(216,35,47,.3); transition: transform .12s, background .15s; }
.video-btn.show { display: inline-flex; }
.video-btn:hover { background: #bf1d28; transform: translateY(-1px); }
.video-btn .yt { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #d8232f; display: flex; align-items: center; justify-content: center; }
.video-btn .yt svg { width: 12px; height: 12px; margin-left: 2px; }
.video-btn .cnt { background: rgba(255,255,255,.25); border-radius: 10px; padding: 1px 8px; font-size: 12px; }

/* VIDEO MODAL */
.vmodal { position: fixed; inset: 0; z-index: 998; background: rgba(15,15,30,.78); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .2s; backdrop-filter: blur(4px); }
.vmodal.show { opacity: 1; pointer-events: all; }
.vbox { width: min(960px, 100%); background: #fdf8ee; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
.vhead { display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
.vhead .vt { font-family: var(--serif); font-weight: 800; font-size: 20px; color: var(--navy); line-height: 1.2; }
.vhead .vs { font-size: 13px; color: var(--muted); margin-top: 2px; }
.vtabs { display: flex; gap: 6px; padding: 0 18px 12px; flex-wrap: wrap; }
.vtabs:empty { display: none; }
.vtab { padding: 7px 14px; border-radius: 16px; background: #f1ebdf; font-size: 13px; font-weight: 700; color: #7d7768; }
.vtab.on { background: var(--navy); color: #fff; }
.vframe { position: relative; aspect-ratio: 16 / 9; background: #000; }
.vframe iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vfoot { padding: 10px 18px; text-align: right; font-size: 13px; }
.vfoot a { color: var(--blue); font-weight: 700; }

.p-now { display: grid; grid-template-columns: auto minmax(0,1fr) minmax(0,1.4fr) auto; align-items: center; gap: 18px; padding: 14px 0 10px; }
.vinyl { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle, #1a1a1a 0 8%, #f5a623 9% 28%, #151515 29% 31%, transparent 32%), repeating-radial-gradient(circle, #151515 0 1.4px, #262626 1.4px 3px); animation: spin 2.4s linear infinite paused; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.playing .vinyl { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.np-title { font-weight: 700; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
.np-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 18px; display: flex; align-items: center; cursor: pointer; }
.prog-track { position: relative; width: 100%; height: 3px; background: #e7e1d4; border-radius: 2px; }
.prog-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--navy); border-radius: 2px; }
.prog-dot { position: absolute; top: 50%; left: 0; width: 11px; height: 11px; border-radius: 50%; background: #9aa0b3; transform: translate(-50%,-50%); }
.playing .prog-dot { background: var(--navy); }
.times { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ctrls { display: flex; align-items: center; gap: 18px; }
.ctrl { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: #6c6f7c; border-radius: 50%; transition: color .15s, background .15s; }
.ctrl:hover { color: var(--navy); background: #f1ebdf; }
.ctrl svg { width: 24px; height: 24px; }
.play { width: 72px; height: 72px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(27,45,107,.35); transition: transform .12s, background .15s; }
.play:hover { background: #22388a; transform: scale(1.04); }
.play svg { width: 28px; height: 28px; }

.p-bottom { display: flex; align-items: center; gap: 16px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modes { display: flex; background: #f1ebdf; border-radius: 10px; padding: 4px; gap: 2px; }
.mode { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 7px; font-size: 13px; font-weight: 700; color: #7d7768; white-space: nowrap; transition: background .15s, color .15s; }
.mode svg { width: 16px; height: 16px; }
.mode:hover { color: var(--navy); }
.mode.on { background: #fff; color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.vol-wrap { display: flex; align-items: center; gap: 8px; color: #6c6f7c; margin-left: auto; }
.vol-wrap svg { width: 20px; height: 20px; }
.vol { -webkit-appearance: none; appearance: none; width: 120px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--navy) var(--v,80%), #e7e1d4 var(--v,80%)); outline: none; cursor: pointer; }
.vol::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--navy); }
.vol::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--navy); }

.tracks { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.trk { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: 8px; text-align: left; transition: border-color .15s, background .15s; min-width: 0; }
.trk:hover { border-color: #c9bfa8; }
.trk .tn { font-family: var(--serif); font-weight: 700; font-size: 18px; min-width: 24px; color: var(--blue); flex-shrink: 0; }
.trk .tp { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #3b3e4c; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.trk .tp svg { width: 12px; height: 12px; }
.trk .tt { font-weight: 700; font-size: 17px; line-height: 1.35; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.trk .eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; opacity: 0; flex-shrink: 0; }
.trk .eq i { width: 3px; background: var(--red); border-radius: 1px; transform-origin: bottom; animation: eq .8s ease-in-out infinite alternate paused; }
.trk .eq i:nth-child(1) { height: 50%; animation-delay: -.2s; } .trk .eq i:nth-child(2) { height: 100%; animation-delay: -.5s; } .trk .eq i:nth-child(3) { height: 70%; animation-delay: -.1s; }
@keyframes eq { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.trk.active { border-color: var(--red); background: #fff3f1; }
.trk.active .tn { color: var(--red); }
.trk.active .tp { background: var(--red); border-color: var(--red); color: #fff; }
.trk.active .eq { opacity: 1; }
.trk.active.playing .eq i { animation-play-state: running; }
.empty { grid-column: 1 / -1; padding: 16px; text-align: center; color: var(--muted); font-size: 14px; background: #fff; border: 1.5px dashed var(--line); border-radius: 8px; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(20,20,40,.45); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; backdrop-filter: blur(4px); }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal { background: #fff; border-radius: 14px; padding: 30px; width: 290px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 48px rgba(0,0,0,.25); }
.modal-title { font-family: var(--serif); font-size: 20px; font-weight: 800; color: var(--navy); }
.modal-input { background: #f6f3ec; border: 2px solid #e6dfcf; font-family: var(--mono); font-size: 20px; padding: 12px; outline: none; letter-spacing: 8px; text-align: center; width: 100%; border-radius: 10px; }
.modal-input:focus { border-color: var(--navy); }
.modal-input.error { border-color: var(--red); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.modal-btns { display: flex; gap: 8px; }
.modal-btn { flex: 1; padding: 11px; font-size: 14px; font-weight: 700; border-radius: 10px; border: 2px solid #e6dfcf; color: var(--muted); }
.modal-btn.ok { background: var(--navy); border-color: var(--navy); color: #fff; }

function lessonHTML(l) {
  const L = lang;
  const total = l.steps.reduce((a, s) => a + s.min, 0);
  const mins = m => (Number.isInteger(m) ? m : m.toFixed(1)) + (L === 'ko' ? '분' : ' min');
  return `
    <div class="l-meta"><span class="tag">${esc(l.age[L])}</span><span class="tag">${T('lTotal')} ${mins(total)}</span></div>
    <p class="l-topic">${esc(l.topic[L])}</p>
    <h3>${T('lGoals')}</h3>
    <ul>${l.goals[L].map(g => `<li>${esc(g)}</li>`).join('')}</ul>
    <h3>${T('lExpr')}</h3>
    <div class="l-expr">${l.expr.map(e => `<span>${esc(e)}</span>`).join('')}</div>
    <h3>${T('lFlow')}</h3>
    <ol class="l-steps">${l.steps.map((s, i) => `
      <li><div class="l-sh"><b>${esc(s.t)}</b><span>${mins(s.min)}</span></div><p>${esc(s[L])}</p></li>`).join('')}
    </ol>
    <h3>${T('lMat')}</h3>
    <p class="l-mat">${esc(l.materials[L])}</p>${l.notes ? `
    <h3>${T('lNotes')}</h3><ul>${l.notes[L].map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${l.eval ? `
    <h3>${T('lEval')}</h3><ol>${l.eval[L].map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}${l.home ? `
    <h3>${T('lHome')}</h3><p class="l-mat">${esc(l.home[L])}</p>` : ''}`;
}
function openLesson() {
  const l = city && LESSONS[city.id];
  if (!l) return;
  $('lTitle').textContent = city.name.toUpperCase() + ' · ' + T('lTitle');
  $('lBody').innerHTML = lessonHTML(l);
  $('lModal').classList.add('show');
}

const SETUP_DIR = 'SETUP';
function setupHTML(id) {
  const S = SETUP[id] || {}, l = LESSONS[id], L = lang;
  const src = f => `${SETUP_DIR}/${id}/${f}`;
  const mins = m => (Number.isInteger(m) ? m : m.toFixed(1)) + (L === 'ko' ? '분' : ' min');
  let h = `<h3>${T('sBanners')}</h3>`;
  if (S.banners && S.banners.length) {
    h += `<p class="l-mat" style="margin-bottom:10px">${esc(S.bannersText[L])}</p><div class="s-gal">${S.banners.map(b =>
      `<figure onclick="zoom('${src(b.f)}', this.querySelector('figcaption').textContent)"><img loading="lazy" src="${src(b.f)}" alt=""><figcaption>${esc(b[L])}</figcaption></figure>`).join('')}</div>`;
  } else if (S.bannersText) {
    h += `<div class="s-note">${T('sNoImg')}<br><b>${esc(S.bannersText[L])}</b></div>`;
  }
  if (S.layout) h += `<h3>${T('sLayout')}</h3><ul>${S.layout[L].split(' / ').map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  if (l && S.steps) {
    h += `<h3>${T('sSteps')}</h3>` + l.steps.map((st, i) => {
      const imgs = S.steps[i] || [];
      return `<div class="s-step"><div class="l-sh"><b>${i + 1}. ${esc(st.t)}</b><span>${mins(st.min)}</span></div>${imgs.length
        ? `<div class="s-thumbs">${imgs.map(f => `<img loading="lazy" src="${src(f)}" alt="" onclick="zoom('${src(f)}', '${esc(st.t).replace(/'/g, '&#39;')}')">`).join('')}</div>` : ''}</div>`;
    }).join('');
  }
  if (l) h += `<h3>${T('sMat')}</h3><p class="l-mat">${esc(l.materials[L])}</p>`;
  return h;
}
function openSetup() {
  if (!city || !SETUP[city.id]) return;
  $('sTitle').textContent = city.name.toUpperCase() + ' · ' + T('setup');
  $('sBody').innerHTML = setupHTML(city.id);
  $('sBody').scrollTop = 0;
  $('sModal').classList.add('show');
}
function closeSetup() { $('sModal').classList.remove('show'); }
function zoom(src, cap) { $('lbImg').src = src; $('lbCap').textContent = cap || ''; $('lightbox').classList.add('show'); }
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('lightbox').classList.contains('show')) { $('lightbox').classList.remove('show'); return; }
  closeSetup();
});

function closeLesson() { $('lModal').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLesson(); });
const vLabel = v => v.label === 'part' ? `${T('vPart')} ${v.n}` : T(v.label || 'vMain');
function updateVideoBtn() {
  const list = city ? (VIDEOS[city.id] || []) : [];
  $('videoBtn').classList.toggle('show', list.length > 0);
  $('lessonBtn').classList.toggle('show', !!(city && LESSONS[city.id]));
  $('setupBtn').classList.toggle('show', !!(city && SETUP[city.id]));
  $('videoCnt').textContent = list.length > 1 ? list.length : '';
  $('videoCnt').style.display = list.length > 1 ? '' : 'none';
}
function openVideo(i = 0) {
  const list = city ? (VIDEOS[city.id] || []) : [];
  if (!list.length) return;
  if (isPlaying) stop();
  vIdx = i;
  const v = list[i];
  $('vTitle').textContent = city.name.toUpperCase() + (list.length > 1 ? ' · ' + vLabel(v) : '');
  $('vTabs').innerHTML = list.length > 1 ? list.map((x, k) => `<button class="vtab ${k === i ? 'on' : ''}" onclick="openVideo(${k})">${esc(vLabel(x))}</button>`).join('') : '';
  $('vFrame').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.yt}?rel=0&autoplay=1" title="${esc(city.name)} teaching video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $('vLink').href = `https://youtu.be/${v.yt}`;
  $('vModal').classList.add('show');
}
function closeVideo() { $('vModal').classList.remove('show'); $('vFrame').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('vModal').classList.contains('show')) closeVideo(); });

    prev:'이전 곡', next:'다음 곡', play:'재생', pause:'일시정지', volume:'볼륨', modeGroup:'재생 방식',
    modeAll:'연속재생', modeOne:'한곡재생', modeRepeat:'반복재생',
    allTip:'목록 전체를 이어서 재생 (끝나면 처음부터)',
    oneTip:'선택한 곡 하나만 재생하고 멈춤',
    repeatTip:'선택한 곡을 계속 반복',
    pickHint:'위에서 도시 카드를 선택하세요 🎵', loading:'음원을 불러오는 중...', noTracks:'아직 등록된 음원이 없어요',
    cancel:'취소', ok:'확인',
    watch:'빅캣의 티칭 영상 시청하기', watchSub:'강사용 교육 영상', openYT:'유튜브에서 열기 ↗',
    vMain:'수업 영상', vParent:'부모참여용', vPart:'영상',
    lesson:'간단 레슨플랜 보기', lessonSub:'강사용 수업 계획안', lTitle:'간단 레슨플랜', admin:'관리자용', setup:'교실 구성 보기', setupSub:'현수막 · 교구 · 교실 배치 — 수업 전에 미리 그려 보세요', sBanners:'현수막 & 배경', sSteps:'활동별 교구', sLayout:'교실 배치', sNoImg:'이 도시의 현수막 디자인 이미지는 아직 없어요. 계획안 기준 목록이에요:', sMat:'전체 준비물', lTotal:'총', lGoals:'학습 목표', lExpr:'핵심 표현', lFlow:'수업 흐름', lMat:'준비물', lNotes:'지도상 유의점', lEval:'활동 평가', lHome:'가정 연계'
  }
};
let lang = 'en';
try { const l = localStorage.getItem('jb-lang'); if (l === 'ko' || l === 'en') lang = l; } catch {}
const T = k => I18N[lang][k] ?? I18N.en[k] ?? k;
function setKey(el, k) { el.dataset.i18n = k; el.textContent = T(k); return el; }
function clearKey(el) { delete el.dataset.i18n; return el; }
const emptyBox = k => `<div class="empty" data-i18n="${k}">${T(k)}</div>`;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = T(el.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.i18nAria)));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}
function setLang(l) {
  lang = l;
  if (city && $('lModal').classList.contains('show')) setTimeout(openLesson);
  if (city && $('sModal').classList.contains('show')) setTimeout(openSetup);
  try { localStorage.setItem('jb-lang', l); } catch {}
  renderCities();
  if (city) $(`card-${city.id}`)?.classList.add('active');
  applyLang();
}

function renderCities() {
  $('cities').innerHTML = CITIES.map((c, i) => `
    <button class="city" id="card-${c.id}" style="--sky:${c.sky||SKY};--ground:${c.ground}" onclick="openCity('${c.id}', true)">
      <span class="scene"></span>
      <span class="a2">${c.a2}</span>
      <span class="a1">${c.a1}</span>
      <span class="txt" style="display:block">
        <div class="num ${NUM_COLOR[i]}">${c.num}</div>
        <div class="name">${esc(c.name.toUpperCase())}</div>
        ${(() => { const sub = lang === 'ko' ? [c.ko, c.sub].filter(Boolean).join(' · ') : (c.sub || ''); return sub ? `<div class="sub">${esc(sub)}</div>` : '<span class="bar"></span>'; })()}
      </span>
      <span class="now-tag"><i></i>NOW PLAYING</span>
    </button>`).join('');
}

async function openCity(id, autoplay = false) {
  const c = CITIES.find(x => x.id === id);
  if (!c) return;
  setOpen(true);
  if (city && city.id === id && tracks.length) return;
  const token = ++loadToken;
  stop();
  city = c; tracks = []; cur = -1;
  document.querySelectorAll('.city').forEach(el => el.classList.toggle('active', el.id === `card-${id}`));
  $('thumb').style.setProperty('--sky', c.sky || SKY);
  $('thumb').style.setProperty('--ground', c.ground);
  $('thumbArt').textContent = c.a1;
  clearKey($('pTitle')).textContent = c.name.toUpperCase();
  updateVideoBtn();
  $('npTitle').textContent = '—'; $('npArtist').textContent = '';
  $('trackList').innerHTML = emptyBox('loading');
  resetProgress();

  try {
    const r = await fetch(`${encodeURI(c.folder)}/tracks.json?t=${Date.now()}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    if (token !== loadToken) return;
    tracks = Array.isArray(d.tracks) ? d.tracks : [];
  } catch { if (token !== loadToken) return; tracks = []; }
  renderTracks();
  if (tracks.length) selectTrack(0, false);
  else setKey($('npTitle'), 'noTracks');
}

function setOpen(on) {
  document.body.classList.toggle('open', on);
  document.body.classList.add('has-city');
  setKey($('listLbl'), on ? 'cityList' : 'collapse');
  if (on) setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 50);
}
function toggleList() { setOpen(!document.body.classList.contains('open')); }

function closeCity() {
  setTimeout(updateVideoBtn);
  document.body.classList.remove('open', 'has-city');
  loadToken++; stop();
  city = null; tracks = []; cur = -1;
  audio.removeAttribute('src'); audio.load();
  document.querySelectorAll('.city').forEach(el => el.classList.remove('active'));
  $('thumb').style.removeProperty('--sky'); $('thumb').style.removeProperty('--ground');
  $('thumbArt').textContent = '🎵';
  setKey($('pTitle'), 'pick');
  $('npTitle').textContent = '—'; $('npArtist').textContent = '';
  $('trackList').innerHTML = emptyBox('pickHint');
  resetProgress();
}

function renderTracks() {
  if (!tracks.length) { $('trackList').innerHTML = emptyBox('noTracks'); return; }
  $('trackList').innerHTML = tracks.map((t, i) => `
    <button class="trk" id="trk-${i}" onclick="onTrackClick(${i})">
      <span class="tn">${String(i+1).padStart(2,'0')}</span>
      <span class="tp"><svg viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg></span>
      <span class="tt">${esc(t.title)}</span>
      <span class="eq"><i></i><i></i><i></i></span>
    </button>`).join('');
}

function onTrackClick(i) { i === cur ? togglePlay() : selectTrack(i, true); }

function selectTrack(i, play) {
  const t = tracks[i]; if (!t) return;
  cur = i;
  audio.src = t.file;
  audio.loop = (mode === 'repeat');
  audio.volume = parseFloat($('vol').value);
  clearKey($('npTitle')).textContent = t.title;
  $('npArtist').textContent = t.artist || '';
  resetProgress();
  document.querySelectorAll('.trk').forEach((el, k) => el.classList.toggle('active', k === i));
  if (play) doPlay(); else setUI(false);
}

function doPlay() { if (cur < 0) return; audio.play().then(() => setUI(true)).catch(() => setUI(false)); }
function stop() { audio.pause(); setUI(false); }
function togglePlay() {
  if (!tracks.length) return;
  if (cur < 0) return selectTrack(0, true);
  isPlaying ? stop() : doPlay();
}
function setUI(on) {
  isPlaying = on;
  $('player').classList.toggle('playing', on);
  document.body.classList.toggle('is-playing', on);
  $('playIco').innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $('playBtn').dataset.i18nAria = on ? 'pause' : 'play'; $('playBtn').setAttribute('aria-label', T(on ? 'pause' : 'play'));
  document.querySelectorAll('.trk').forEach((el, k) => {
    const a = k === cur;
    el.classList.toggle('playing', a && on);
    el.querySelector('.tp svg').innerHTML = (a && on) ? ICON_PAUSE : ICON_PLAY;
  });
}
function next(play) { if (tracks.length) selectTrack((cur + 1) % tracks.length, play); }
function prev(play) {
  if (!tracks.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  selectTrack((cur - 1 + tracks.length) % tracks.length, play);
}

audio.addEventListener('ended', () => {
  if (mode === 'repeat') { audio.currentTime = 0; doPlay(); return; }
  if (mode === 'one')    { setUI(false); audio.currentTime = 0; return; }
  next(true);
});
audio.addEventListener('pause', () => { if (!audio.ended) setUI(false); });
audio.addEventListener('play',  () => setUI(true));
$('playBtn').addEventListener('click', togglePlay);
$('nextBtn').addEventListener('click', () => next(isPlaying));
$('prevBtn').addEventListener('click', () => prev(isPlaying));

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
function setMode(m) {
  mode = m; audio.loop = (m === 'repeat');
  document.querySelectorAll('.mode').forEach(b => { const on = b.dataset.mode === m; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  try { localStorage.setItem('jb-mode', m); } catch {}
}

function resetProgress() { $('progFill').style.width = '0%'; $('progDot').style.left = '0%'; $('tNow').textContent = '0:00'; $('tDur').textContent = '0:00'; }
audio.addEventListener('loadedmetadata', () => { $('tDur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const p = audio.currentTime / audio.duration * 100;
  $('progFill').style.width = p + '%'; $('progDot').style.left = p + '%';
  $('tNow').textContent = fmt(audio.currentTime); $('tDur').textContent = fmt(audio.duration);
});
$('prog').addEventListener('click', e => {
  if (!audio.duration) return;
  const r = $('prog').getBoundingClientRect();
  audio.currentTime = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * audio.duration;
});

function paintVol() { $('vol').style.setProperty('--v', ($('vol').value * 100) + '%'); }
$('vol').addEventListener('input', e => { audio.volume = parseFloat(e.target.value); paintVol(); });
paintVol();

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); togglePlay(); }
});

const ADMIN_PW = '123456789!';
function openModal() { const i = $('adminPw'); i.value = ''; i.classList.remove('error'); $('adminModal').classList.add('show'); setTimeout(() => i.focus(), 200); }
function closeModal() { $('adminModal').classList.remove('show'); }
function checkPw() {
  if ($('adminPw').value === ADMIN_PW) { closeModal(); location.href = 'admin.html'; }
  else { const i = $('adminPw'); i.classList.add('error'); i.value = ''; setTimeout(() => i.classList.remove('error'), 400); }
}
$('adminPw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); if (e.key === 'Escape') closeModal(); });
$('adminModal').addEventListener('click', e => { if (e.target.id === 'adminModal') closeModal(); });

renderCities();
applyLang();
try { const m = localStorage.getItem('jb-mode'); if (m) setMode(m); } catch {}
</script>
</body>
</html>
